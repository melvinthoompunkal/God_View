# ============================================================
#  God_View — Root Docker Compose
# ============================================================

version: "3.9"

# ----- Services -----
services:
  # — PostgreSQL + PostGIS (spatial data) —
  postgres:
    image: postgis/postgis:16-3.4
    container_name: godview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-godview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-godview_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-godview}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - god-mode-net

  # — Redis (caching / message broker) —
  redis:
    image: redis:7-alpine
    container_name: godview-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - god-mode-net

  # — Zookeeper (Kafka dependency) —
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: godview-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zkdata:/var/lib/zookeeper/data
      - zklog:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - god-mode-net

  # — Apache Kafka (event streaming) —
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: godview-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # --- Listener configuration ---
      # INTERNAL  → container-to-container on god-mode-net (port 29092)
      # EXTERNAL  → host machine access (port 9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - god-mode-net

  # TODO: add more services here (api, client, ingestion, ml-workers …)

# ----- Volumes -----
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  zkdata:
    driver: local
  zklog:
    driver: local
  kafkadata:
    driver: local

# ----- Networks -----
networks:
  god-mode-net:
    driver: bridge
